name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v6
        with:
          # Tags are needed to derive the plugin version from the newest release tag and to check that the
          # csproj fallback version did not fall behind it.
          fetch-depth: 0

      - name: Checkout Lertaro SDK
        uses: actions/checkout@v6
        with:
          repository: Lertaro/Lertaro
          path: LertaroSdk

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Check version drift
        shell: pwsh
        run: |
          $fallback = ([xml](Get-Content '.\Lertaro\DoubleCommander.csproj' -Raw)).Project.PropertyGroup.Version |
            Where-Object { $_ } | Select-Object -First 1
          $tag = (git describe --tags --match "v*" --abbrev=0) -replace '^v', ''
          Write-Output "csproj fallback version: $fallback / newest tag: v$tag"
          if (-not $fallback -or -not $tag) {
            throw 'Could not read the csproj fallback version or the newest v* tag.'
          }
          if ([version]$fallback -lt [version]$tag) {
            throw "Lertaro/DoubleCommander.csproj still says $fallback but v$tag is already released - bump the fallback version."
          }
          if ([version]$fallback -ne [version]$tag) {
            Write-Output "Note: the fallback is ahead of the newest tag (preparing v$fallback); builds report v$tag from git."
          }

      - name: Run heuristic tests
        shell: pwsh
        run: dotnet run --project .\tests\DoubleCommander.Heuristics.Tests.csproj

      - name: Build Lertaro plugin
        shell: pwsh
        run: >-
          dotnet build .\Lertaro\DoubleCommander.csproj
          --configuration Release
          -p:LertaroRoot="${{ github.workspace }}\LertaroSdk"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: Lertaro-DoubleCommander
          path: Lertaro\bin\Release\net10.0-windows\Lertaro.Plugins.DoubleCommander.dll
          if-no-files-found: error

      - name: Report built plugin version
        shell: pwsh
        run: |
          $dll = 'Lertaro\bin\Release\net10.0-windows\Lertaro.Plugins.DoubleCommander.dll'
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($dll)
          Write-Output "Built DLL reports FileVersion=$($info.FileVersion) ProductVersion=$($info.ProductVersion)"
