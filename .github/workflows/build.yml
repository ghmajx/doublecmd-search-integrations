name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v6

      - name: Checkout Lertaro SDK
        uses: actions/checkout@v6
        with:
          repository: Lertaro/Lertaro
          path: LertaroSdk

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Run heuristic tests
        shell: pwsh
        run: dotnet run --project .\tests\DoubleCommander.Heuristics.Tests.csproj

      - name: Build Lertaro plugin
        shell: pwsh
        run: >-
          dotnet build .\Lertaro\DoubleCommander.csproj
          --configuration Release
          -p:LertaroRoot="${{ github.workspace }}\LertaroSdk"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lertaro-DoubleCommander
          path: Lertaro\bin\Release\net10.0-windows\Lertaro.Plugins.DoubleCommander.dll
          if-no-files-found: error
