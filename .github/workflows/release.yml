name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v6

      - name: Checkout Lertaro SDK
        uses: actions/checkout@v6
        with:
          repository: Lertaro/Lertaro
          path: LertaroSdk

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Run heuristic tests
        shell: pwsh
        run: dotnet run --project .\tests\DoubleCommander.Heuristics.Tests.csproj

      - name: Build Lertaro plugin
        shell: pwsh
        run: >-
          dotnet build .\Lertaro\DoubleCommander.csproj
          --configuration Release
          -p:LertaroRoot="${{ github.workspace }}\LertaroSdk"

      - name: Package release files
        shell: pwsh
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          $dll = Join-Path $env:GITHUB_WORKSPACE 'Lertaro\bin\Release\net10.0-windows\Lertaro.Plugins.DoubleCommander.dll'
          Copy-Item $dll $dist -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'README.md') $dist -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'LICENSE') $dist -Force

          $listaryDist = Join-Path $dist 'Listary'
          New-Item -ItemType Directory -Force -Path $listaryDist | Out-Null
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'Listary\DoubleCommander.Listary.ps1') $listaryDist -Force

          $zip = Join-Path $env:GITHUB_WORKSPACE ("DoubleCommander-Search-Integrations-" + $env:GITHUB_REF_NAME + '.zip')
          Compress-Archive -Path (Join-Path $dist '*') -DestinationPath $zip -Force
          "RELEASE_DLL=$dll" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            $env:RELEASE_ZIP `
            $env:RELEASE_DLL `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --title ("Double Commander Search Integrations " + $env:GITHUB_REF_NAME) `
            --generate-notes
